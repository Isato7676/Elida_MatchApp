<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infantil Elida MatchApp</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Infantil Elida MatchApp</h1>

    <!-- PANTALLA PRINCIPAL: MIS EQUIPOS / AÑADIR -->
    <div id="view-main">
      
      <div class="tabs">
        <button class="tab-btn active" onclick="showMainTab('favs')">⭐ Mis Equipos</button>
        <button class="tab-btn" onclick="showMainTab('add')">➕ Añadir Equipo</button>
      </div>

      <!-- PESTAÑA 1: MIS EQUIPOS -->
      <div id="main-tab-favs" class="card">
        <div id="favs-container">
          <!-- Se puebla dinámicamente -->
        </div>
      </div>

      <!-- PESTAÑA 2: FORMULARIO AÑADIR EQUIPO -->
      <div id="main-tab-add" class="card" style="display: none;">
        <h2 style="font-size:1rem; margin-top:0; color:var(--text-muted);">Buscar y Seleccionar Equipo</h2>
        
        <div class="form-group">
          <label for="select-season">Temporada</label>
          <select id="select-season" onchange="loadCompetitions()">
            <option value="">Cargando temporadas...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="select-gametype">Modalidad</label>
          <select id="select-gametype" onchange="loadCompetitions()" disabled>
            <option value="1">Fútbol 11</option>
            <option value="2">Fútbol 7</option>
            <option value="3">Fútbol Sala</option>
          </select>
        </div>

        <div class="form-group">
          <label for="select-competition">Competición</label>
          <select id="select-competition" onchange="loadGroups()" disabled>
            <option value="">Selecciona Competición</option>
          </select>
        </div>

        <div class="form-group">
          <label for="select-group">Grupo</label>
          <select id="select-group" onchange="loadTeams()" disabled>
            <option value="">Selecciona Grupo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="select-team">Equipo</label>
          <select id="select-team" disabled onchange="checkAddButton()">
            <option value="">Selecciona tu Equipo</option>
          </select>
        </div>

        <button id="btn-add" class="btn-primary" disabled onclick="addFavorite()">Guardar en Mis Equipos</button>

        <div id="status" class="status-msg"></div>
      </div>

    </div>

    <!-- PANTALLA DE DETALLE DE LIGA -->
    <div id="view-league" style="display: none;">
      
      <div class="tabs">
        <button class="tab-btn active" onclick="showLeagueTab('home')">🏠 Inicio</button>
        <button class="tab-btn" onclick="showLeagueTab('calendar')">📅 Jornadas</button>
        <button class="tab-btn" onclick="showLeagueTab('standings')">🏆 Clasificación</button>
      </div>

      <div class="card" id="league-title-card">
        <h2 id="league-team-title" style="margin:0; font-size:1.1rem; color:var(--primary-blue);"></h2>
        <div id="league-sub-title" style="font-size:0.8rem; color:var(--text-muted); margin-top:2px;"></div>
      </div>

      <!-- VISTA CALENDARIO -->
      <div id="tab-calendar" class="card">
        <div class="nav-jornada">
          <button class="btn-primary" onclick="changeJornada(-1)">◀ Anterior</button>
          <span id="jornada-label" style="font-weight:bold; font-size:0.95rem;">Jornada 1</span>
          <button class="btn-primary" onclick="changeJornada(1)">Siguiente ▶</button>
        </div>

        <div id="matches-container">
          <!-- Se puebla dinámicamente -->
        </div>
      </div>

      <!-- VISTA CLASIFICACIÓN -->
      <div id="tab-standings" class="card" style="display:none;">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Pos</th>
                <th style="text-align:left;">Equipo</th>
                <th>Pts</th>
                <th>PJ</th>
                <th>PG</th>
                <th>PE</th>
                <th>PP</th>
              </tr>
            </thead>
            <tbody id="standings-body">
              <!-- Se puebla dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script>
    // Variables globales de la app
    window.leagueData = null;
    window.currentFav = null;
    window.currentJornada = 1;
    window.maxJornadas = 34;

    // Conexión centralizada al servidor proxy Vercel
    async function apiFetch(endpoint, params = {}) {
      const query = new URLSearchParams({ endpoint, ...params }).toString();
      const response = await fetch(`/api/rffm?${query}`);
      if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
      return await response.json();
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSeasons();
      renderFavorites();
    });

    // PESTAÑAS PRINCIPALES (INICIO)
    function showMainTab(tab) {
      document.querySelectorAll('#view-main .tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'favs') {
        document.querySelectorAll('#view-main .tab-btn')[0].classList.add('active');
        document.getElementById('main-tab-favs').style.display = 'block';
        document.getElementById('main-tab-add').style.display = 'none';
        renderFavorites();
      } else {
        document.querySelectorAll('#view-main .tab-btn')[1].classList.add('active');
        document.getElementById('main-tab-favs').style.display = 'none';
        document.getElementById('main-tab-add').style.display = 'block';
      }
    }

    // FAVORITOS (localStorage)
    function getFavorites() {
      return JSON.parse(localStorage.getItem('rffm_favs') || '[]');
    }

    function saveFavorites(favs) {
      localStorage.setItem('rffm_favs', JSON.stringify(favs));
    }

    function renderFavorites() {
      const container = document.getElementById('favs-container');
      const favs = getFavorites();

      if (favs.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:20px 10px;">
            <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:12px;">Aún no has guardado ningún equipo.</p>
            <button class="btn-primary" style="width:auto; padding:8px 16px;" onclick="showMainTab('add')">➕ Añadir mi primer equipo</button>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      favs.forEach((item, index) => {
        container.innerHTML += `
          <div class="fav-item">
            <div class="fav-info" onclick="openLeague(${index})">
              <div class="fav-title">${item.nombreEquipo}</div>
              <div class="fav-sub">${item.nombreCompeticion} - ${item.nombreGrupo}</div>
            </div>
            <button class="btn-del" onclick="deleteFavorite(${index})">✕</button>
          </div>
        `;
      });
    }

    function addFavorite() {
      const selSeason = document.getElementById('select-season');
      const selGame = document.getElementById('select-gametype');
      const selComp = document.getElementById('select-competition');
      const selGroup = document.getElementById('select-group');
      const selTeam = document.getElementById('select-team');

      if (!selTeam.value) return;

      const newFav = {
        temporada: selSeason.value,
        tipojuego: selGame.value,
        competicion: selComp.value,
        grupo: selGroup.value,
        equipo: selTeam.value,
        nombreTemporada: selSeason.options[selSeason.selectedIndex].text,
        nombreCompeticion: selComp.options[selComp.selectedIndex].text,
        nombreGrupo: selGroup.options[selGroup.selectedIndex].text,
        nombreEquipo: selTeam.options[selTeam.selectedIndex].text
      };

      const favs = getFavorites();
      favs.push(newFav);
      saveFavorites(favs);
      showMainTab('favs');
    }

    function deleteFavorite(index) {
      const favs = getFavorites();
      favs.splice(index, 1);
      saveFavorites(favs);
      renderFavorites();
    }

    function checkAddButton() {
      const selTeam = document.getElementById('select-team');
      document.getElementById('btn-add').disabled = !selTeam.value;
    }

    // FORMULARIO DESPLEGABLE EN CASCADA
    async function loadSeasons() {
      const select = document.getElementById('select-season');
      try {
        const seasons = await apiFetch('seasons');
        select.innerHTML = '<option value="">Selecciona Temporada</option>';
        if (Array.isArray(seasons)) {
          seasons.forEach(s => {
            const code = s.cod_temporada || s.codigo || s.id;
            const name = s.nombre || s.nombre_temporada || s.temporada;
            if (code && name) select.innerHTML += `<option value="${code}">${name}</option>`;
          });
        }
        document.getElementById('select-gametype').disabled = false;
      } catch (e) {
        select.innerHTML = '<option value="">Error al cargar temporadas</option>';
      }
    }

    async function loadCompetitions() {
      const temporada = document.getElementById('select-season').value;
      const tipojuego = document.getElementById('select-gametype').value;
      const selectComp = document.getElementById('select-competition');

      selectComp.innerHTML = '<option value="">Cargando competiciones...</option>';
      selectComp.disabled = true;

      if (!temporada || !tipojuego) return;

      try {
        const comps = await apiFetch('competitions', { temporada, tipojuego });
        selectComp.disabled = false;
        selectComp.innerHTML = '<option value="">Selecciona Competición</option>';
        if (Array.isArray(comps)) {
          comps.forEach(c => {
            const code = c.codigo || c.cod_competicion;
            const name = c.nombre || c.nombre_competicion;
            if (code && name) selectComp.innerHTML += `<option value="${code}">${name}</option>`;
          });
        }
      } catch (e) {
        selectComp.innerHTML = '<option value="">Error al cargar</option>';
      }
    }

    async function loadGroups() {
      const competicion = document.getElementById('select-competition').value;
      const selectGroup = document.getElementById('select-group');

      selectGroup.innerHTML = '<option value="">Cargando grupos...</option>';
      selectGroup.disabled = true;

      if (!competicion) return;

      try {
        const groups = await apiFetch('groups', { competicion });
        selectGroup.disabled = false;
        selectGroup.innerHTML = '<option value="">Selecciona Grupo</option>';
        if (Array.isArray(groups)) {
          groups.forEach(g => {
            const code = g.codigo || g.cod_grupo;
            const name = g.nombre || g.nombre_grupo;
            if (code && name) selectGroup.innerHTML += `<option value="${code}">${name}</option>`;
          });
        }
      } catch (e) {
        selectGroup.innerHTML = '<option value="">Error al cargar</option>';
      }
    }

    async function loadTeams() {
      const temporada = document.getElementById('select-season').value;
      const tipojuego = document.getElementById('select-gametype').value;
      const competicion = document.getElementById('select-competition').value;
      const grupo = document.getElementById('select-group').value;
      const select = document.getElementById('select-team');
      const statusDiv = document.getElementById('status');

      if (!grupo) return;

      select.disabled = false;
      select.innerHTML = '<option value="">Descargando liga y equipos...</option>';
      statusDiv.innerText = "Descargando datos de la RFFM...";

      try {
        const resData = await apiFetch('calendario-next', { temporada, tipojuego, competicion, grupo });
        window.leagueData = resData?.pageProps || resData || {};
        
        const teamMap = new Map();

        function extractTeamsDeep(obj) {
          if (!obj || typeof obj !== 'object') return;
          if (Array.isArray(obj)) { obj.forEach(item => extractTeamsDeep(item)); return; }

          const c1 = obj.codigo_equipo_local || obj.cod_equipo_local || obj.id_equipo_local;
          const n1 = obj.equipo_local || obj.nombre_equipo_local;
          const c2 = obj.codigo_equipo_visitante || obj.cod_equipo_visitante || obj.id_equipo_visitante;
          const n2 = obj.equipo_visitante || obj.nombre_equipo_visitante;

          if (c1 && n1) teamMap.set(String(c1), String(n1).trim());
          if (c2 && n2) teamMap.set(String(c2), String(n2).trim());

          const cDirect = obj.cod_equipo || obj.codigo_equipo || obj.id_equipo;
          const nDirect = obj.nombre_equipo || obj.equipo;

          if (cDirect && nDirect && typeof nDirect === 'string' && !['Home', 'Away'].includes(nDirect)) {
            teamMap.set(String(cDirect), String(nDirect).trim());
          }

          Object.keys(obj).forEach(k => {
            if (typeof obj[k] === 'object' && obj[k] !== null) extractTeamsDeep(obj[k]);
          });
        }

        extractTeamsDeep(window.leagueData);

        if (teamMap.size === 0) {
          select.innerHTML = '<option value="">Sin equipos detectados</option>';
          statusDiv.innerText = "No se detectaron equipos.";
          return;
        }

        select.innerHTML = '<option value="">Selecciona tu Equipo</option>';
        const sortedTeams = Array.from(teamMap.entries()).sort((a, b) => a[1].localeCompare(b[1]));
        sortedTeams.forEach(([codigo, nombre]) => {
          select.innerHTML += `<option value="${codigo}">${nombre}</option>`;
        });

        statusDiv.innerText = `Liga cargada: ${sortedTeams.length} equipos disponibles.`;

      } catch (e) {
        select.innerHTML = '<option value="">Error al cargar equipos</option>';
        statusDiv.innerText = "Error al descargar datos.";
      }
    }

    // VISTA DETALLE LIGA
    async function openLeague(favIndex) {
      const favs = getFavorites();
      const fav = favs[favIndex];
      if (!fav) return;

      window.currentFav = fav;
      window.currentJornada = 1;

      document.getElementById('view-main').style.display = 'none';
      document.getElementById('view-league').style.display = 'block';

      document.getElementById('league-team-title').innerText = fav.nombreEquipo;
      document.getElementById('league-sub-title').innerText = `${fav.nombreCompeticion} - ${fav.nombreGrupo}`;

      try {
        const resData = await apiFetch('calendario-next', {
          temporada: fav.temporada,
          tipojuego: fav.tipojuego,
          competicion: fav.competicion,
          grupo: fav.grupo
        });
        window.leagueData = resData?.pageProps || resData || {};
        showLeagueTab('calendar');
      } catch (e) {
        alert("Error al conectar con la RFFM");
      }
    }

    function showLeagueTab(tabName) {
      if (tabName === 'home') {
        document.getElementById('view-league').style.display = 'none';
        document.getElementById('view-main').style.display = 'block';
        return;
      }

      document.querySelectorAll('#view-league .tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab-standings').style.display = 'none';
      document.getElementById('tab-calendar').style.display = 'none';

      if (tabName === 'calendar') {
        document.querySelectorAll('#view-league .tab-btn')[1].classList.add('active');
        document.getElementById('tab-calendar').style.display = 'block';
        renderMatches();
      } else if (tabName === 'standings') {
        document.querySelectorAll('#view-league .tab-btn')[2].classList.add('active');
        document.getElementById('tab-standings').style.display = 'block';
        renderStandings();
      }
    }

    // RENDERIZADO DE CALENDARIO
    function changeJornada(delta) {
      window.currentJornada += delta;
      if (window.currentJornada < 1) window.currentJornada = 1;
      if (window.currentJornada > window.maxJornadas) window.currentJornada = window.maxJornadas;
      renderMatches();
    }

    function renderMatches() {
      document.getElementById('jornada-label').innerText = `Jornada ${window.currentJornada}`;
      const container = document.getElementById('matches-container');
      container.innerHTML = '';

      if (!window.leagueData || !window.leagueData.calendar) return;

      const rounds = window.leagueData.calendar.rounds || [];
      const currentRoundObj = rounds.find(r => String(r.codjornada) === String(window.currentJornada));

      if (!currentRoundObj || !Array.isArray(currentRoundObj.equipos)) {
        container.innerHTML = `<p style="text-align:center; padding:20px; color:var(--text-muted);">No hay partidos programados para la Jornada ${window.currentJornada}.</p>`;
        return;
      }

      const matches = currentRoundObj.equipos;
      const myCode = String(window.currentFav?.equipo || '');

      matches.forEach(m => {
        const local = m.equipo_local || 'Local';
        const cLocal = String(m.codigo_equipo_local || '');
        const visitante = m.equipo_visitante || 'Visitante';
        const cVisitante = String(m.codigo_equipo_visitante || '');

        const gL = (m.goles_casa !== undefined && m.goles_casa !== '') ? m.goles_casa : '-';
        const gV = (m.goles_visitante !== undefined && m.goles_visitante !== '') ? m.goles_visitante : '-';

        const fecha = m.fecha || '';
        const hora = m.hora || '';
        const campo = m.campo || '';

        const isMyMatch = (cLocal && cLocal === myCode) || (cVisitante && cVisitante === myCode) || 
                          local.toLowerCase().includes(window.currentFav?.nombreEquipo.toLowerCase()) || 
                          visitante.toLowerCase().includes(window.currentFav?.nombreEquipo.toLowerCase());

        container.innerHTML += `
          <div class="match-card ${isMyMatch ? 'highlight' : ''}">
            <div class="match-header">${fecha} ${hora ? ' - ' + hora : ''} ${campo ? '| ' + campo : ''}</div>
            <div class="match-teams">
              <span class="team-name">${local}</span>
              <span class="score">${gL} - ${gV}</span>
              <span class="team-name">${visitante}</span>
            </div>
          </div>
        `;
      });
    }

    // RENDERIZADO DE CLASIFICACIÓN
    function renderStandings() {
      const tbody = document.getElementById('standings-body');
      tbody.innerHTML = '';

      if (!window.leagueData || !window.leagueData.calendar) return;

      const calendar = window.leagueData.calendar;
      let standings = calendar.clasificacion || calendar.standings || [];

      // Cálculo dinámico si no viene en origen
      if (!Array.isArray(standings) || standings.length === 0) {
        const teamStats = new Map();

        function getOrCreate(name, code) {
          if (!teamStats.has(code || name)) {
            teamStats.set(code || name, { name, pts: 0, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, code: code || '' });
          }
          return teamStats.get(code || name);
        }

        (calendar.rounds || []).forEach(r => {
          (r.equipos || []).forEach(m => {
            const l = getOrCreate(m.equipo_local, m.codigo_equipo_local);
            const v = getOrCreate(m.equipo_visitante, m.codigo_equipo_visitante);

            if (m.goles_casa !== '' && m.goles_visitante !== '' && m.goles_casa !== null && m.goles_visitante !== null) {
              const gL = parseInt(m.goles_casa);
              const gV = parseInt(m.goles_visitante);

              l.pj++; v.pj++;
              l.gf += gL; l.gc += gV;
              v.gf += gV; v.gc += gL;

              if (gL > gV) { l.pts += 3; l.pg++; v.pp++; }
              else if (gL < gV) { v.pts += 3; v.pg++; l.pp++; }
              else { l.pts += 1; v.pts += 1; l.pe++; v.pe++; }
            }
          });
        });

        standings = Array.from(teamStats.values()).sort((a, b) => b.pts - a.pts || (b.gf - b.gc) - (a.gf - a.gc));
      }

      if (standings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="padding:16px; color:var(--text-muted);">No hay datos de clasificación.</td></tr>';
        return;
      }

      const myCode = String(window.currentFav?.equipo || '');

      standings.forEach((item, index) => {
        const pos = item.posicion || item.puesto || (index + 1);
        const name = item.nombre_equipo || item.equipo || item.name || 'Equipo';
        const code = String(item.cod_equipo || item.codigo_equipo || item.code || '');
        const pts = item.puntos !== undefined ? item.puntos : item.pts;
        const pj = item.jugados !== undefined ? item.jugados : item.pj;
        const pg = item.ganados !== undefined ? item.ganados : item.pg;
        const pe = item.empatados !== undefined ? item.empatados : item.pe;
        const pp = item.perdidos !== undefined ? item.perdidos : item.pp;

        const isMyTeam = (code && code === myCode) || name.toLowerCase().includes(window.currentFav?.nombreEquipo.toLowerCase());

        tbody.innerHTML += `
          <tr class="${isMyTeam ? 'highlight-team' : ''}">
            <td>${pos}</td>
            <td style="text-align:left;">${name}</td>
            <td><strong>${pts}</strong></td>
            <td>${pj}</td>
            <td>${pg}</td>
            <td>${pe}</td>
            <td>${pp}</td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
