<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Fútbol Base - Selector de Ligas</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --primary: #2563eb;
      --primary-light: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      
      --my-team-bg: #064e3b;
      --my-team-border: #10b981;
      --my-team-text: #fbbf24;
      
      --danger: #ef4444;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; border-left: 1px solid var(--surface-border); border-right: 1px solid var(--surface-border); }

    header { background-color: #1e293b; border-bottom: 1px solid var(--surface-border); padding: 16px; text-align: center; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.1rem; font-weight: 700; }

    main { flex: 1; padding: 16px; padding-bottom: 90px; }
    .screen { display: none; }
    .screen.active { display: block; }

    .hero-banner { background: linear-gradient(135deg, #1e40af 0%, #1e1b4b 100%); border: 1px solid #3b82f6; border-radius: var(--radius); padding: 18px; margin-bottom: 20px; text-align: center; }
    .hero-banner h2 { font-size: 1.2rem; margin-bottom: 6px; color: #fff; }
    .hero-banner p { font-size: 0.85rem; color: #93c5fd; margin-bottom: 12px; }

    .card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
    
    .btn { display: inline-block; width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: var(--radius); font-weight: 600; font-size: 0.9rem; cursor: pointer; text-align: center; }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }

    .team-card { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .team-info h3 { font-size: 1rem; color: var(--text); margin-bottom: 4px; }
    .team-info p { font-size: 0.8rem; color: var(--text-muted); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .form-group select, .form-group input { width: 100%; padding: 12px; background: var(--surface); border: 1px solid var(--surface-border); color: var(--text); border-radius: var(--radius); outline: none; font-size: 0.9rem; }

    .subtabs { display: flex; background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); padding: 4px; margin-bottom: 16px; }
    .subtab { flex: 1; padding: 10px; text-align: center; font-size: 0.85rem; font-weight: 600; border-radius: 8px; cursor: pointer; color: var(--text-muted); }
    .subtab.active { background: var(--primary); color: white; }

    .jornada-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--surface-border); padding: 10px 14px; border-radius: var(--radius); }
    .jornada-nav button { background: #334155; border: none; color: var(--text); padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    .match-card { padding: 12px; }
    .match-card.is-my-team { background-color: var(--my-team-bg); border: 1px solid var(--my-team-border); }
    .match-card.is-my-team .match-team.highlight-team { color: var(--my-team-text); font-weight: 800; }

    .match-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px; border-bottom: 1px solid var(--surface-border); padding-bottom: 6px; }
    .match-body { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.9rem; }
    .match-team { flex: 1; color: var(--text); }
    .match-team.right { text-align: right; }
    .match-score { background: #0f172a; border: 1px solid var(--surface-border); color: var(--primary-light); padding: 4px 10px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; margin: 0 8px; }

    nav.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #1e293b; display: flex; border-top: 1px solid var(--surface-border); z-index: 100; }
    .nav-item { flex: 1; padding: 12px 0; text-align: center; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; font-weight: 600; }
    .nav-item.active { color: var(--primary-light); }
  </style>
</head>
<body>

  <header>
    <h1 id="header-title">Mis Equipos y Ligas</h1>
  </header>

  <main>
    <!-- 1. PORTADA -->
    <section id="screen-home" class="screen active">
      <div class="hero-banner">
        <h2>⚽ Mi Fútbol Base</h2>
        <p>Selecciona la liga y categoría de tu equipo para consultar resultados.</p>
        <button class="btn" onclick="showScreen('add', 'Añadir Nueva Liga')">➕ Seleccionar Nueva Liga</button>
      </div>

      <div id="my-teams-list"></div>
    </section>

    <!-- 2. SELECTOR DE LIGA POR DESPLEGABLES -->
    <section id="screen-add" class="screen">
      <div class="card">
        <h3 style="margin-bottom: 12px; font-size: 1rem;">Configurar Liga a Seguir</h3>

        <div class="form-group">
          <label>Categoría y División</label>
          <select id="select-competicion">
            <option value="26737819" data-name="Preferente Infantil">Preferente Infantil</option>
            <option value="26737820" data-name="Primera Infantil">Primera Infantil</option>
            <option value="26737821" data-name="Segunda Infantil">Segunda Infantil</option>
            <option value="26737815" data-name="Preferente Alevín">Preferente Alevín</option>
            <option value="26737816" data-name="Primera Alevín">Primera Alevín</option>
          </select>
        </div>

        <div class="form-group">
          <label>Grupo</label>
          <select id="select-grupo">
            <option value="26737824">Grupo 5</option>
            <option value="26737820">Grupo 1</option>
            <option value="26737821">Grupo 2</option>
            <option value="26737822">Grupo 3</option>
            <option value="26737823">Grupo 4</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nombre de tu equipo (Para resaltarlo en amarillo)</label>
          <input type="text" id="input-filter" value="ELIDA" placeholder="Ej: ELIDA">
        </div>

        <div class="form-group">
          <label>Nombre personalizado para la tarjeta</label>
          <input type="text" id="input-custom-name" value="Élida Olimpia Infantil A" placeholder="Ej: Élida Infantil A">
        </div>

        <button class="btn" onclick="guardarLigaSeleccionada()">⭐ Guardar Liga</button>
      </div>
    </section>

    <!-- 3. PANTALLA DETALLE DE LIGA -->
    <section id="screen-league" class="screen">
      <div class="subtabs">
        <div class="subtab active">📅 Resultados / Jornada</div>
      </div>

      <div id="subtab-calendar">
        <div class="jornada-nav">
          <button onclick="cambiarJornada(-1)">◄ Prev</button>
          <span id="jornada-label"><strong>Jornada 1</strong></span>
          <button onclick="cambiarJornada(1)">Sig ►</button>
        </div>

        <div id="matches-container">
          <p style="text-align: center; color: var(--text-muted);">Cargando partidos...</p>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>

  <script>
    let misEquipos = JSON.parse(localStorage.getItem('misEquipos')) || [
      {
        nombre: 'Élida Olimpia Infantil A',
        categoria: 'Preferente Infantil - Grupo 5',
        temporada: '22',
        competicion: '26737819',
        grupo: '26737824',
        filtroNombre: 'ELIDA'
      }
    ];

    let equipoActivo = null;
    let jornadaActual = 1;

    window.onload = function() {
      renderMyTeams();
      showScreen('home', 'Mis Equipos');
    };

    function renderMyTeams() {
      const container = document.getElementById('my-teams-list');
      if (misEquipos.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; color: var(--text-muted); padding: 30px 10px;">
            <p style="font-size: 1rem; margin-bottom: 8px;">No tienes ninguna liga guardada.</p>
            <p style="font-size: 0.8rem;">Pulsa en <strong>"➕ Seleccionar Nueva Liga"</strong> para empezar.</p>
          </div>`;
        return;
      }

      container.innerHTML = '';
      misEquipos.forEach((eq, index) => {
        const card = document.createElement('div');
        card.className = 'card team-card';
        card.onclick = () => abrirLiga(eq);
        card.innerHTML = `
          <div class="team-info">
            <h3>${eq.nombre}</h3>
            <p>${eq.categoria}</p>
          </div>
          <button class="btn-danger" onclick="event.stopPropagation(); eliminarEquipo(${index});">🗑️</button>
        `;
        container.appendChild(card);
      });
    }

    function eliminarEquipo(index) {
      misEquipos.splice(index, 1);
      localStorage.setItem('misEquipos', JSON.stringify(misEquipos));
      renderMyTeams();
    }

    function showScreen(screenId, title) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + screenId).classList.add('active');
      document.getElementById('header-title').innerText = title;

      const nav = document.getElementById('bottom-nav');
      if (screenId === 'league') {
        nav.innerHTML = `<div class="nav-item active" onclick="showScreen('home', 'Mis Equipos')">🏠 Volver a Inicio</div>`;
      } else {
        nav.innerHTML = `
          <div class="nav-item ${screenId === 'home' ? 'active' : ''}" onclick="showScreen('home', 'Mis Equipos')">🏠 Inicio</div>
          <div class="nav-item ${screenId === 'add' ? 'active' : ''}" onclick="showScreen('add', 'Seleccionar Liga')">➕ Añadir Liga</div>
        `;
      }
    }

    function guardarLigaSeleccionada() {
      const compSelect = document.getElementById('select-competicion');
      const grupoSelect = document.getElementById('select-grupo');
      
      const compId = compSelect.value;
      const compName = compSelect.options[compSelect.selectedIndex].getAttribute('data-name');
      const grupoId = grupoSelect.value;
      const grupoName = grupoSelect.options[grupoSelect.selectedIndex].text;

      const filtro = document.getElementById('input-filter').value.trim().toUpperCase() || 'ELIDA';
      const customName = document.getElementById('input-custom-name').value.trim() || `${compName} - ${grupoName}`;

      const nuevaLiga = {
        nombre: customName,
        categoria: `${compName} - ${grupoName}`,
        temporada: '22',
        competicion: compId,
        grupo: grupoId,
        filtroNombre: filtro
      };

      misEquipos.push(nuevaLiga);
      localStorage.setItem('misEquipos', JSON.stringify(misEquipos));
      renderMyTeams();
      showScreen('home', 'Mis Equipos');
    }

    function abrirLiga(equipo) {
      equipoActivo = equipo;
      jornadaActual = 1;
      showScreen('league', equipo.nombre);
      cargarDatosRFFM();
    }

    function cambiarJornada(delta) {
      if (jornadaActual + delta >= 1) {
        jornadaActual += delta;
        document.getElementById('jornada-label').innerHTML = `<strong>Jornada ${jornadaActual}</strong>`;
        cargarDatosRFFM();
      }
    }

    // Consulta de datos analizando la estructura SSR / HTML de la RFFM
    async function cargarDatosRFFM() {
      if (!equipoActivo) return;

      const container = document.getElementById('matches-container');
      container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 20px;">Cargando partidos de la RFFM...</p>';

      const targetUrl = `https://www.rffm.es/competicion/resultados-y-jornadas?temporada=${equipoActivo.temporada}&competicion=${equipoActivo.competicion}&grupo=${equipoActivo.grupo}&jornada=${jornadaActual}&tipojuego=1`;
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

      try {
        const res = await fetch(proxyUrl);
        const html = await res.text();
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Extraer datos embebidos de Next.js si están disponibles
        const nextDataScript = doc.getElementById('__NEXT_DATA__');
        
        if (nextDataScript) {
          const jsonData = JSON.parse(nextDataScript.innerText);
          console.log("Datos de la RFFM recibidos:", jsonData);
        }

        // Parseo visual por bloques/filas
        const filas = doc.querySelectorAll('tr, .row, [class*="partido"]');
        
        if (filas.length > 0) {
          container.innerHTML = '';
          let creados = 0;

          filas.forEach(f => {
            const txt = f.innerText.trim().replace(/\s+/g, ' ');
            if (txt.length > 15 && (txt.includes('-') || txt.includes('vs') || txt.includes(':'))) {
              creados++;
              const esMiEquipo = txt.toUpperCase().includes(equipoActivo.filtroNombre);
              
              const card = document.createElement('div');
              card.className = `card match-card ${esMiEquipo ? 'is-my-team' : ''}`;
              card.innerHTML = `<div style="font-size: 0.88rem; line-height: 1.4;">${txt}</div>`;
              container.appendChild(card);
            }
          });

          if (creados === 0) {
            container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 20px;">Jornada ${jornadaActual}: Consulta realizada correctamente pero sin partidos programados.</p>`;
          }
        } else {
          container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 20px;">No se encontraron partidos para esta jornada.</p>';
        }

      } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="text-align:center; color: var(--danger); padding: 20px;">Error al conectar con la RFFM. Inténtalo de nuevo.</p>';
      }
    }
  </script>
</body>
</html>
